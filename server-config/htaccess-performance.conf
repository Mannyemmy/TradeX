# WealthWise performance rules - compression + caching
#
# NOT deployed by git (.htaccess is gitignored, since it is edited on the server).
# Paste this block into the LIVE .htaccess at
#   /home/wealthw5/tradexpromax/.htaccess
# ABOVE the '# php -- BEGIN cPanel-generated handler' line.
#
# Also add 'avif' to the static-asset passthrough RewriteCond so it reads:
#   RewriteCond %{REQUEST_URI} \.(jpg|jpeg|png|gif|ico|svg|webp|avif|bmp|css|js|woff|woff2|ttf|eot|otf|map)$ [NC]
#
# Without these the site loses gzip (~84% of every HTML response) and
# far-future caching on /assets/ - roughly half the optimization.

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
    AddOutputFilterByType DEFLATE application/javascript application/x-javascript text/javascript
    AddOutputFilterByType DEFLATE application/json application/xml application/rss+xml
    AddOutputFilterByType DEFLATE image/svg+xml
    # Already-compressed formats: don't waste CPU re-compressing
    SetEnvIfNoCase Request_URI \.(?:woff2?|png|jpe?g|gif|webp|avif|ico|zip|gz)$ no-gzip dont-vary
</IfModule>
<IfModule mod_brotli.c>
    AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css
    AddOutputFilterByType BROTLI_COMPRESS application/javascript text/javascript
    AddOutputFilterByType BROTLI_COMPRESS application/json image/svg+xml
</IfModule>

# --- Performance: caching ---
# /assets/ filenames are content-hashed, so they are safe to cache forever.
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/png         "access plus 1 year"
    ExpiresByType image/jpeg        "access plus 1 year"
    ExpiresByType image/gif         "access plus 1 year"
    ExpiresByType image/webp        "access plus 1 year"
    ExpiresByType image/avif        "access plus 1 year"
    ExpiresByType image/svg+xml     "access plus 1 year"
    ExpiresByType image/x-icon      "access plus 1 year"
    ExpiresByType font/woff         "access plus 1 year"
    ExpiresByType font/woff2        "access plus 1 year"
    ExpiresByType text/css          "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
    ExpiresByType text/html         "access plus 0 seconds"
</IfModule>
<IfModule mod_headers.c>
    <FilesMatch "\.(woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "\.(css|js)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
    Header unset ETag
</IfModule>
FileETag None

# Correct MIME types (needed for compression + caching rules above)
<IfModule mod_mime.c>
    AddType font/woff2 .woff2
    AddType font/woff  .woff
    AddType image/avif .avif
    AddType image/webp .webp
    AddType image/svg+xml .svg
</IfModule>
