---
deployment:
  tasks:
    # All real work lives in server-config/deploy-sync.sh. Keeping it in a
    # script instead of inline tasks avoids cPanel's fragile YAML parsing of
    # long quoted commands, and lets the same logic run by hand when the
    # cPanel task runner misbehaves (it reports failed tasks as successful).
    - bash "$PWD/server-config/deploy-sync.sh"
